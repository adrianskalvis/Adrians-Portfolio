<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Swipegami cover: a gum wrapper with crane creases, and the folded crane. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fdf1ea"/>
      <stop offset="1" stop-color="#f4e6dc"/>
    </linearGradient>
    <linearGradient id="wrapper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#e9edf2" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- the flat gum wrapper the crane started as -->
  <g transform="rotate(-9 210 210)">
    <rect x="96" y="120" width="230" height="170" rx="6" fill="url(#wrapper)" stroke="#ffffff" stroke-width="2"/>
    <path d="M96 120 L326 290 M326 120 L96 290 M211 120 V290 M96 205 H326" stroke="#c9d3de" stroke-width="1.5" stroke-dasharray="7 8" fill="none"/>
  </g>

  <!-- arrow from wrapper to crane -->
  <path d="M212 318 C 222 346, 242 364, 268 374" stroke="#d98f78" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="2 12"/>

  <!-- shadow -->
  <ellipse cx="410" cy="770" rx="210" ry="26" fill="#c98672" opacity="0.28" filter="url(#soft)"/>

  <!-- the crane: traditional orizuru, side view facing left, wings raised -->
  <g stroke="#fff6f1" stroke-width="2" stroke-linejoin="round">
    <!-- far wing, behind the body -->
    <polygon points="372,600 470,592 300,300" fill="#f8cbbb"/>
    <polygon points="421,596 470,592 300,300" fill="#f0b19c"/>
    <!-- tail -->
    <polygon points="512,640 548,620 700,400" fill="#f0a089"/>
    <polygon points="530,630 548,620 700,400" fill="#de7b64"/>
    <!-- neck -->
    <polygon points="358,642 314,618 224,380 242,375" fill="#f0a089"/>
    <polygon points="336,630 314,618 224,380" fill="#de7b64"/>
    <!-- head, reverse folded so the beak points down -->
    <polygon points="224,380 242,375 176,434" fill="#d4614a"/>
    <!-- body -->
    <polygon points="318,620 432,566 548,620 436,700" fill="#e57a60"/>
    <polygon points="432,566 548,620 436,700" fill="#d4614a"/>
    <polygon points="318,620 436,700 380,668" fill="#cf5a43"/>
    <!-- near wing, in front -->
    <polygon points="392,606 500,596 612,262" fill="#f5b29c"/>
    <polygon points="446,601 500,596 612,262" fill="#e48468"/>
  </g>

  <!-- step dots and swipe hint -->
  <g fill="#e2a493">
    <circle cx="340" cy="878" r="6"/>
    <circle cx="370" cy="878" r="6"/>
    <circle cx="400" cy="878" r="9" fill="#d8654d"/>
    <circle cx="430" cy="878" r="6"/>
    <circle cx="460" cy="878" r="6"/>
  </g>
  <path d="M286 878 l14 -12 M286 878 l14 12 M514 878 l-14 -12 M514 878 l-14 12" stroke="#d98f78" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
