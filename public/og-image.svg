<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Adrian Kalvis — Programming Technician and Web Developer</title>
  <desc id="desc">A light blue liquid-glass inspired social card for Adrian Kalvis's portfolio.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fcfe"/>
      <stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
    <radialGradient id="orb" cx="30%" cy="25%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".88"/>
      <stop offset=".4" stop-color="#b7e4ff" stop-opacity=".48"/>
      <stop offset="1" stop-color="#8fd6ff" stop-opacity=".08"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".84"/>
      <stop offset="1" stop-color="#dff3ff" stop-opacity=".48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#5da9d3" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1040" cy="105" r="215" fill="url(#orb)"/>
  <circle cx="965" cy="545" r="155" fill="url(#orb)" opacity=".72"/>
  <circle cx="160" cy="545" r="205" fill="url(#orb)" opacity=".5"/>
  <rect x="68" y="62" width="1064" height="506" rx="58" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".9" filter="url(#shadow)"/>
  <path d="M94 134h84" stroke="#9adcfb" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1045" cy="148" r="45" fill="#ffffff" fill-opacity=".45" stroke="#ffffff" stroke-opacity=".9"/>
  <circle cx="1045" cy="148" r="18" fill="#a6def9" fill-opacity=".7"/>
  <text x="118" y="250" fill="#172332" font-family="Georgia, 'Times New Roman', serif" font-size="88" letter-spacing="-2">Adrian Kalvis</text>
  <text x="122" y="330" fill="#3a5265" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" letter-spacing=".5">PROGRAMMING TECHNICIAN · WEB DEVELOPER</text>
  <text x="122" y="412" fill="#617685" font-family="Arial, Helvetica, sans-serif" font-size="27">Clear, responsive web applications across frontend and backend.</text>
  <rect x="118" y="465" width="204" height="56" rx="28" fill="#ffffff" fill-opacity=".56" stroke="#ffffff"/>
  <text x="151" y="502" fill="#377c9f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600">akalvis.com</text>
</svg>
